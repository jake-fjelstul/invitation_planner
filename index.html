<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Two Lanes to New Orleans — A Road Trip Invitation</title>
  <meta name="description" content="A vintage road atlas invitation for a weekend road trip from Atlanta to New Orleans.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts: Fraunces & Overpass -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..600&family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Preload Cover Background Images -->
  <link rel="preload" as="image" href="assets/0.jpeg">
  <link rel="preload" as="image" href="assets/1.jpeg">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=23">
  
  <!-- Supabase CDN (dormant until final prompt) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app-viewport" data-atmosphere="dusk">
    <div id="viewport-bg" class="viewport-bg" aria-hidden="true"></div>
    <div id="viewport-overlay" class="viewport-overlay" aria-hidden="true"></div>
    
    <!-- Single Centered Fixed-Size Card Shell -->
    <div id="app-card">
      
      <!-- FIXED HEADER (78px) -->
      <header class="card-header" id="card-header">
        <button type="button" class="header-back-btn" id="header-back-btn" aria-label="Go to previous screen">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="header-progress-wrap" aria-hidden="true">
          <div class="header-progress-track" id="header-progress-track">
            <div class="header-progress-line header-progress-line--dashed"></div>
            <div class="header-progress-line header-progress-line--solid" id="header-progress-solid"></div>
            <div class="header-progress-car" id="header-progress-car">
              <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="#24262B" stroke-width="2">
                <path d="M 10 6 C 10 4, 22 4, 22 6 L 24 12 L 25 24 C 25 26, 23 28, 20 28 L 12 28 C 9 28, 7 26, 7 24 L 8 12 Z" fill="#F2C14E" />
                <path d="M 11 11 C 12 9, 20 9, 21 11 L 22 15 L 10 15 Z" fill="#24262B" opacity="0.8" />
                <circle cx="10" cy="6" r="1.5" fill="#FFFFFF" stroke="none" />
                <circle cx="22" cy="6" r="1.5" fill="#FFFFFF" stroke="none" />
              </svg>
            </div>
          </div>
        </div>

        <div class="header-step-count" id="header-step-count">00 / 10</div>
      </header>

      <!-- SCROLLABLE BODY (flex: 1) -->
      <main class="card-body" id="card-body">
        <div id="stage">
          <section class="screen-section screen-section--cover is-active" id="screen-cover" data-screen-index="0"></section>
          <section class="screen-section screen-section--plan" id="screen-plan" data-screen-index="1"></section>
          <section class="screen-section screen-section--suitcase" id="screen-suitcase" data-screen-index="2"></section>
          <section class="screen-section screen-section--cooler" id="screen-cooler" data-screen-index="3"></section>
          <section class="screen-section screen-section--vibe" id="screen-vibe" data-screen-index="4"></section>
          <section class="screen-section screen-section--playlist" id="screen-playlist" data-screen-index="5"></section>
          <section class="screen-section screen-section--postcards" id="screen-postcards" data-screen-index="6"></section>
          <section class="screen-section screen-section--menu" id="screen-menu" data-screen-index="7"></section>
          <section class="screen-section screen-section--satnight" id="screen-satnight" data-screen-index="8"></section>
          <section class="screen-section screen-section--notes" id="screen-notes" data-screen-index="9"></section>
          <section class="screen-section screen-section--confirmation screen-section--final" id="screen-confirmation" data-screen-index="10"></section>
        </div>
      </main>

      <!-- FIXED FOOTER (76px) -->
      <footer class="card-footer" id="card-footer">
        <button type="button" class="footer-primary-btn" id="footer-primary-btn">
          START THE CAR
        </button>
      </footer>

    </div>
  </div>

  <!-- Application Logic Modules -->
  <script type="module">
    import { SCREENS } from './js/data.js?v=23';
    import { state, loadAnswers, subscribe, setScreenIndex, markScreenCompleted, getAnswers } from './js/state.js?v=23';
    import { init as initCover } from './js/screens/cover.js?v=23';
    import { init as initPlan } from './js/screens/plan.js?v=23';
    import { init as initSuitcase } from './js/screens/suitcase.js?v=23';
    import { init as initCooler } from './js/screens/cooler.js?v=23';
    import { init as initVibe } from './js/screens/vibe.js?v=23';
    import { init as initPlaylist } from './js/screens/playlist.js?v=23';
    import { init as initPostcards } from './js/screens/postcards.js?v=23';
    import { init as initMenu } from './js/screens/menu.js?v=23';
    import { init as initSaturdayNight } from './js/screens/saturdayNight.js?v=23';
    import { init as initNotes } from './js/screens/notes.js?v=23';
    import { init as initConfirmation } from './js/screens/confirmation.js?v=23';
    import { initSupabase, saveInvitationResponse } from './js/supabase.js?v=23';

    // Expose setScreenIndex to window for helper testing
    window.setScreenIndex = setScreenIndex;

    // DOM Elements
    const viewport = document.getElementById('app-viewport');
    const cardBody = document.getElementById('card-body');
    const headerBackBtn = document.getElementById('header-back-btn');
    const headerProgressSolid = document.getElementById('header-progress-solid');
    const headerProgressCar = document.getElementById('header-progress-car');
    const headerStepCount = document.getElementById('header-step-count');
    const footerPrimaryBtn = document.getElementById('footer-primary-btn');

    const screenCoverEl = document.getElementById('screen-cover');
    const screenPlanEl = document.getElementById('screen-plan');
    const screenSuitcaseEl = document.getElementById('screen-suitcase');
    const screenCoolerEl = document.getElementById('screen-cooler');
    const screenVibeEl = document.getElementById('screen-vibe');
    const screenPlaylistEl = document.getElementById('screen-playlist');
    const screenPostcardsEl = document.getElementById('screen-postcards');
    const screenMenuEl = document.getElementById('screen-menu');
    const screenSatnightEl = document.getElementById('screen-satnight');
    const screenNotesEl = document.getElementById('screen-notes');
    const screenConfirmationEl = document.getElementById('screen-confirmation');

    let lastRenderedIndex = -1;

    // Update Header Progress & Chrome
    function updateHeaderChrome() {
      const index = state.currentScreenIndex;
      
      const imgUrl = `url('assets/${index}.jpeg')`;

      // Update background image for current screen index
      const viewportBg = document.getElementById('viewport-bg');
      if (viewportBg) {
        viewportBg.style.backgroundImage = imgUrl;
      }

      const appCard = document.getElementById('app-card');
      if (appCard) {
        appCard.style.backgroundImage = `linear-gradient(rgba(239, 230, 210, 0.78), rgba(239, 230, 210, 0.78)), ${imgUrl}`;
        appCard.style.backgroundSize = 'cover';
        appCard.style.backgroundPosition = 'center';
      }

      // Step Count label ("00 / 10", "04 / 10", etc.)
      const stepStr = String(index).padStart(2, '0');
      headerStepCount.textContent = `${stepStr} / 10`;

      // Progress car math (0% to 100%)
      const pct = Math.min(Math.max((index / 10) * 100, 0), 100);
      headerProgressSolid.style.width = `${pct}%`;
      headerProgressCar.style.left = `${pct}%`;

      // Back button visibility
      if (index === 0) {
        headerBackBtn.classList.add('is-hidden');
        headerBackBtn.disabled = true;
      } else {
        headerBackBtn.classList.remove('is-hidden');
        headerBackBtn.disabled = false;
      }

      // Update active atmosphere glow
      const currentAtmosphere = SCREENS[index]?.atmosphere || 'dusk';
      viewport.setAttribute('data-atmosphere', currentAtmosphere);

      // Primary Button Label in Footer
      if (index === 0) {
        footerPrimaryBtn.textContent = "Start";
      } else if (index === 9) {
        footerPrimaryBtn.textContent = "Send it";
      } else if (index === 10) {
        footerPrimaryBtn.textContent = "Start over";
      } else {
        footerPrimaryBtn.textContent = "Next";
      }

      // Scroll card body back to top on screen change
      if (cardBody) cardBody.scrollTop = 0;
    }

    // Handle Screen Swapping
    function renderScreen() {
      const index = state.currentScreenIndex;
      lastRenderedIndex = index;
      
      const sections = document.querySelectorAll('.screen-section');
      sections.forEach(s => s.classList.remove('is-active'));

      if (index === 0) {
        initCover(screenCoverEl, () => setScreenIndex(1));
        screenCoverEl.classList.add('is-active');
      } else if (index === 1) {
        initPlan(screenPlanEl);
        screenPlanEl.classList.add('is-active');
      } else if (index === 2) {
        initSuitcase(screenSuitcaseEl);
        screenSuitcaseEl.classList.add('is-active');
      } else if (index === 3) {
        initCooler(screenCoolerEl);
        screenCoolerEl.classList.add('is-active');
      } else if (index === 4) {
        initVibe(screenVibeEl);
        screenVibeEl.classList.add('is-active');
      } else if (index === 5) {
        initPlaylist(screenPlaylistEl);
        screenPlaylistEl.classList.add('is-active');
      } else if (index === 6) {
        initPostcards(screenPostcardsEl);
        screenPostcardsEl.classList.add('is-active');
      } else if (index === 7) {
        initMenu(screenMenuEl);
        screenMenuEl.classList.add('is-active');
      } else if (index === 8) {
        initSaturdayNight(screenSatnightEl);
        screenSatnightEl.classList.add('is-active');
      } else if (index === 9) {
        initNotes(screenNotesEl);
        screenNotesEl.classList.add('is-active');
      } else if (index === 10) {
        initConfirmation(screenConfirmationEl);
        screenConfirmationEl.classList.add('is-active');
      }

      updateHeaderChrome();
    }

    // Event Listeners for Header & Footer Nav Buttons
    headerBackBtn.addEventListener('click', () => {
      if (state.currentScreenIndex > 0) {
        setScreenIndex(state.currentScreenIndex - 1);
      }
    });

    footerPrimaryBtn.addEventListener('click', async () => {
      if (state.currentScreenIndex === 10) {
        setScreenIndex(0);
        return;
      }
      if (state.currentScreenIndex === 9) {
        try {
          await saveInvitationResponse(getAnswers());
        } catch (err) {
          console.warn('Supabase save error:', err);
        }
      }
      markScreenCompleted(state.currentScreenIndex);
      if (state.currentScreenIndex < SCREENS.length - 1) {
        setScreenIndex(state.currentScreenIndex + 1);
      }
    });

    // Boot App
    function boot() {
      // Preload background images (0.jpeg to 10.jpeg)
      for (let i = 0; i <= 10; i++) {
        const img = new Image();
        img.src = `assets/${i}.jpeg`;
      }

      initSupabase();
      loadAnswers();
      renderScreen();

      subscribe((currState, changeType) => {
        if (changeType === 'navigation' || state.currentScreenIndex !== lastRenderedIndex) {
          renderScreen();
        } else {
          updateHeaderChrome();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
